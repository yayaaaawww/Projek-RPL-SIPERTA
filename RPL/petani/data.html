<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../asset/style.css">
    <title>SIPERTA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
    <div class="sidebar p-3">

       <a href="dashboard.html">
            <i class="bi bi-house-door"></i>
        </a>

        <a href="data.html">
            <i class="bi bi-database"></i>
        </a>

        <a href="konsultasi.html">
            <i class="bi bi-chat-left"></i>
        </a>

        <a href="laporan.html">
                <i class="bi bi-exclamation-triangle"></i>
            </a>

        <a href="katalog.html">
            <i class="bi bi-cart-plus"></i>
        </a>

        <hr class="text-white">

        <a href="../auth/login.html">
            <i class="bi bi-box-arrow-right"></i>
        </a>


    </div>


    <div class="main-content">
        <div class="header">
        <h1>SIPERTA</h1>
            <div>
                <i class="bi bi-person-circle"></i> Profile
            </div>
        </div>
        <h2 class="page-title">Data Pertanian</h2>

        <div class="lahan-grid" id="lahanGrid">

            <div class="lahan-card">
                <p>Nama Lahan</p>
                <p>Jenis Tanaman</p>
                <p>Luas Lahan</p>
            </div>

            <div class="add-card" data-bs-toggle="modal" data-bs-target="#tambahModal">
                <i class="bi bi-plus-lg"></i>
            </div>
        </div>
    </div>

    <div class="modal fade" id="tambahModal">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5>Tambah Data Pertanian</h5>
            </div>

            <div class="modal-body">
                <form id="formLahan">
                    <div class="mb-3">
                        <label>Nama Lahan</label>
                        <input type="text" class="form-control" id="namaLahan" required>
                    </div>

                    <div class="mb-3">
                        <label>Jenis Tanaman</label>
                        <input type="text" class="form-control" id="jenisTanaman" required>
                    </div>

                    <div class="mb-3">
                        <label>Luas Lahan</label>
                        <input type="text" class="form-control" id="luasLahan" required>
                    </div>

                    <button type="submit" class="btn btn-success"> Simpan </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const form =
    document.getElementById("formLahan");

    const lahanGrid =
    document.getElementById("lahanGrid");

    form.addEventListener("submit", function(e){

        e.preventDefault();

        const nama =
        document.getElementById("namaLahan").value;

        const jenis =
        document.getElementById("jenisTanaman").value;

        const luas =
        document.getElementById("luasLahan").value;

        const card =
        document.createElement("div");

        card.classList.add("lahan-card");

        card.innerHTML = `
            <p>${nama}</p>
            <p>${jenis}</p>
            <p>${luas} Hektar</p>
        `;

        const addCard =
        document.querySelector(".add-card");

        console.log("Data ditambah");
        lahanGrid.insertBefore(card, addCard);

        form.reset();

        bootstrap.Modal
        .getInstance(
            document.getElementById("tambahModal")
        )
        .hide();

    });
</script>

</body>
</html>
