<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>SIPERTA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../asset/style.css">

</head>
<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="sidebar p-3">

        <a href="dashboardAdm.html">
            <i class="bi bi-house-door"></i>
        </a>

        <a href="pengguna.html">
            <i class="bi bi-people"></i>
        </a>

        <a href="laporanAdm.html">
            <i class="bi bi-exclamation-triangle"></i>
        </a>

        <a href="transaksi.html">
            <i class="bi bi-receipt"></i>
        </a>

        <hr class="text-white">

        <a href="../auth/login.html">
            <i class="bi bi-box-arrow-right"></i>
        </a>

    </div>

    <!-- CONTENT -->
    <div class="dashboard-container">

        <div class="dashboard-header">

            <h1 class="title">SIPERTA</h1>

        </div>

        <div class="dashboard-content">

            <h2 class="page-title">
                Data Transaksi
            </h2>

            <div class="activity-card">

                <table class="table table-bordered">

                    <thead>

                        <tr>
                            <th>Tanggal</th>
                            <th>Produk</th>
                            <th>Pembeli</th>
                            <th>Penjual</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>

                    </thead>

                    <tbody id="tabelTransaksi">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

const transaksi =
JSON.parse(
    localStorage.getItem("transaksi")
) || [];

const tabel =
document.getElementById("tabelTransaksi");

transaksi.forEach((item,index)=>{

    tabel.innerHTML += `

    <tr>

        <td>${item.tanggal}</td>

        <td>${item.produk}</td>

        <td>${item.pembeli}</td>

        <td>${item.penjual}</td>

        <td>Rp ${item.total}</td>

        <td>

            <span class="badge bg-warning">
                ${item.status}
            </span>

        </td>

        <td>

            <button
                class="btn btn-success btn-sm"
                onclick="selesai(${index})">

                Selesai

            </button>

            <button
                class="btn btn-danger btn-sm"
                onclick="hapus(${index})">

                Hapus

            </button>

        </td>

    </tr>

    `;
});

function selesai(index)
{
    transaksi[index].status =
    "Selesai";

    localStorage.setItem(
        "transaksi",
        JSON.stringify(transaksi)
    );

    location.reload();
}

function hapus(index)
{
    transaksi.splice(index,1);

    localStorage.setItem(
        "transaksi",
        JSON.stringify(transaksi)
    );

    location.reload();
}

</script>

</body>
</html>
