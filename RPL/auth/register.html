<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../asset/style.css">
    <title>SIPERTA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container login-container">
        <div class="row justify-content-center align-items-center" style="height: 100vh;">
            <div class="col-md-5">
                <div class="card login-card p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">SIPERTA</h2>
                        <p class="register-subtitle">Sistem Informasi Pertanian Terpadu</p>
                    </div>
                    
                    <form id="registerForm" method="POST">
                            <div class="mb-3">
                                <label for="name" class="form-label">Nama</label>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Masukkan nama lengkap" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Masukkan email" required>
                            </div>

                            <div class="mb-3">
                                <label for="nomor" class="form-label">Nomor HP</label>
                                <input type="tel" class="form-control" id="nomor" name="nomor" placeholder="Masukkan no. Handphone" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" required>
                            </div>

                            <div class="mb-3">
                            <label for="role" class="form-label">Role</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="" selected disabled> Pilih Role </option>
                                <option value="petani"> Petani </option>
                                <option value="pedagang"> Pedagang </option>
                                <option value="konsultan"> Konsultan </option>
                            </select>
                        </div>
                        <p class="text-center mb-3"> Sudah punya akun? <a href="../auth/login.html"> Login di sini </a></p>
                        <button type="submit" class="btn btn-success w-100"> Register </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
